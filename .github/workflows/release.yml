name: Release

on:
  push:
    tags:
      - 'v*.*'

jobs:
  # Atoll's local publisher signs and uploads the tested archives.
  check-atoll-build:
    if: github.repository == 'bobodread876/paseo-startos'
    permissions:
      contents: read
    uses: Start9Labs/start-technologies/.github/workflows/build.yml@master

  release:
    if: github.repository != 'bobodread876/paseo-startos'
    uses: Start9Labs/start-technologies/.github/workflows/release.yml@master
    with:
      RELEASE_REGISTRY: ${{ vars.RELEASE_REGISTRY }}
      S3_S9PKS_BASE_URL: ${{ vars.S3_S9PKS_BASE_URL }}
    secrets:
      DEV_KEY: ${{ secrets.DEV_KEY }}
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
    permissions:
      contents: write
